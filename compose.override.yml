# Local development on top of compose.yml. Compose merges this file
# automatically; Coolify never reads it.
#
# It does three things:
#   - maps the values from your .env onto the variables compose.yml takes from
#     Coolify's magic SERVICE_* variables, which do not exist locally;
#   - publishes ports and enables live reload;
#   - adds the services that only exist locally: the frontend (Cloudflare in
#     production), Adminer, MailCatcher and Playwright.

x-local-backend-env: &local-backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
  API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  POSTGRES_USER: ${POSTGRES_USER?Variable not set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
  SMTP_HOST: "mailcatcher"
  SMTP_PORT: "1025"
  SMTP_TLS: "false"
  EMAILS_FROM_EMAIL: "noreply@example.com"

services:

  db:
    restart: "no"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-app}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}

  redis:
    restart: "no"
    ports:
      - "6379:6379"

  prestart:
    environment: *local-backend-env

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    environment: *local-backend-env
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov

  celery-worker:
    restart: "no"
    environment: *local-backend-env
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild

  celery-beat:
    restart: "no"
    environment: *local-backend-env

  adminer:
    image: adminer
    restart: "no"
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  # Production serves the frontend from Cloudflare Workers (frontend/wrangler.jsonc);
  # locally it is the same build behind Nginx.
  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      # Healthy, not merely started: the first test's API call otherwise races
      # uvicorn's startup and fails with "socket hang up".
      backend:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
