name: Smokeshow

on:
  workflow_run:
    workflows: [Test Backend]
    types: [completed]

env:
  # Publishing needs an auth key (generate one with `smokeshow generate-key`
  # and store it as the SMOKESHOW_AUTH_KEY repository secret)
  HAS_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY != '' }}

jobs:
  smokeshow:
    # Only publish coverage when the tests produced it
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install smokeshow
      - uses: actions/download-artifact@v8
        with:
          name: coverage-html
          path: backend/htmlcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: smokeshow upload backend/htmlcov
        if: env.HAS_AUTH_KEY == 'true'
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 90
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
