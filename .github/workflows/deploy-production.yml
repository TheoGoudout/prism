name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on:
      - self-hosted
      - production
    # The DOTENV secret of the "production" GitHub environment holds the whole
    # .env file (see deployment.md)
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Write .env
        run: printf '%s\n' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
      - run: docker compose -f compose.yml build
      - run: docker compose -f compose.yml up -d
