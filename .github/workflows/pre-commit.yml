name: pre-commit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Forks and Dependabot don't have access to secrets
  HAS_SECRETS: ${{ secrets.PRE_COMMIT != '' }}

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # The autofix push uses the PRE_COMMIT token, not this one.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        name: Checkout PR for own repo
        if: env.HAS_SECRETS == 'true'
        with:
          # To be able to commit it needs the head of the branch, not the
          # merge commit, and the full history to compute diffs
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # A token other than the default GITHUB_TOKEN is needed for the
          # autofix commit to trigger CI
          token: ${{ secrets.PRE_COMMIT }} # zizmor: ignore[secrets-outside-env]
          # Load-bearing: the autofix commit is pushed through the credential
          # helper this checkout installs. This job uploads no artifacts, so
          # there is nothing for the persisted credential to leak into.
          persist-credentials: true # zizmor: ignore[artipacked] -- required for `git push`
      # pre-commit lite ci needs the default checkout configs to work
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        name: Checkout PR for fork
        if: env.HAS_SECRETS == 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install backend dependencies
        run: uv sync --all-packages
      - name: Install frontend dependencies
        run: bun ci
      # The client-generation hook imports the backend, which needs settings
      - name: Create .env files from the examples
        run: .github/scripts/shared/create-env-files.sh
      - name: Run prek - pre-commit
        id: precommit
        env:
          BASE_REF: ${{ github.base_ref }}
          # The zizmor hook runs offline; this is only for its rate limit.
          GH_TOKEN: ${{ github.token }}
        run: uvx prek run --from-ref "origin/${BASE_REF}" --to-ref HEAD --show-diff-on-failure
        # Hooks that reformat files exit non-zero. The job must survive that
        # so the steps below can push the fixes; the last step re-raises it.
        continue-on-error: true
      - name: Commit and push changes
        if: env.HAS_SECRETS == 'true'
        run: .github/scripts/pre-commit/commit-and-push-changes.sh
      - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: env.HAS_SECRETS == 'false'
        with:
          msg: 🎨 Auto format and update with pre-commit
      - name: Error out on pre-commit errors
        if: steps.precommit.outcome == 'failure'
        run: exit 1

  # https://github.com/marketplace/actions/alls-green#why
  pre-commit-alls-green: # The one check branch protection requires.
    name: All pre-commit checks passed
    if: always()
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # Reads `needs`; touches nothing.
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
