name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # CI only talks to throwaway containers, so the example settings
      # (and their dummy credentials) are fine, and need no repository secrets.
      # That also lets Dependabot and fork PRs, which can't read secrets, run CI.
      - name: Create .env files from the examples
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env

      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
