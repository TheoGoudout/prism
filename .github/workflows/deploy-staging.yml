name: Deploy to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on:
      - self-hosted
      - staging
    # The DOTENV secret of the "staging" GitHub environment holds the whole
    # .env file (see deployment.md)
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Write .env
        run: printf '%s\n' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
      - run: docker compose -f compose.yml build
      - run: docker compose -f compose.yml up -d
