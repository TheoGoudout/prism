name: Release

# Publishing a GitHub release deploys it to production, as one run:
#
#   1. the backend image, built from the release's tag and pushed to GHCR;
#   2. the backend to Coolify, pinned to the tag and pulling that image;
#   3. then the frontend to Cloudflare, built from the same tag.
#
# The order is deliberate: the API is upgraded before the clients that call it,
# and a backend that failed to deploy stops the frontend. "Re-run failed jobs"
# retries only the target that broke.
#
# Pre-releases are not deployed. A manual dispatch re-deploys an existing
# release, all of it or one target. The last job's conclusion is the release's:
# it fails when any target did.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. v1.2.0"
        required: true
        type: string
      targets:
        description: "Which targets to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - coolify
          - cloudflare

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      run_cloudflare: ${{ steps.targets.outputs.cloudflare }}
      run_coolify: ${{ steps.targets.outputs.coolify }}
    steps:
      # The steps below run scripts from .github/scripts/, and one of them calls
      # scripts/set-version.mjs, so this job needs the tree even though it
      # builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache. This job installs nothing — it runs set-version.mjs, which
          # is dependency-free — so there is nothing for a restored cache to
          # speed up, and this workflow is privileged: it is triggered by a
          # published release and its called workflows hold the production
          # deploy credentials. A cache entry poisoned by a less-privileged
          # workflow has no business being restored here. (zizmor: cache-poisoning)
          no-cache: true

      - name: Resolve tag, version and pre-release flag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/release/resolve-tag-version-and-pre-release-flag.sh

      - name: Resolve targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: .github/scripts/release/resolve-targets.sh

  images:
    name: Backend image
    needs: resolve
    # Built only when it is about to be deployed: same condition as coolify.
    if: >-
      needs.resolve.outputs.run_coolify == 'true' &&
      needs.resolve.outputs.prerelease != 'true'
    permissions:
      contents: read
      packages: write # images.yml pushes the backend image to GHCR.
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/images.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  coolify:
    name: Coolify production (backend)
    # Behind the image build: the Coolify host pulls the image rather than
    # building it, so it has to exist first.
    needs: [resolve, images]
    # Same pre-release exclusion as Cloudflare below — an RC must not reach the
    # production API any more than it may reach the production domains.
    if: >-
      needs.resolve.outputs.run_coolify == 'true' &&
      needs.resolve.outputs.prerelease != 'true'
    permissions:
      contents: read
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/deploy-coolify.yml # zizmor: ignore[self-repository]
    with:
      environment: production
      ref: ${{ needs.resolve.outputs.tag }}
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}

  cloudflare:
    name: Cloudflare production
    # Sequenced behind the backend so the API is upgraded before the frontend
    # that calls it.
    needs: [resolve, images, coolify]
    # Pre-releases must not reach the production domains.
    #
    # `always()` is what lets a *skipped* coolify job through — `targets: cloudflare`
    # skips it, and a plain `needs:` would then skip this job too. A coolify job
    # that actually failed still blocks the frontend deploy — and so does a
    # failed image build, which skips coolify rather than failing it.
    if: >-
      always() &&
      needs.resolve.outputs.run_cloudflare == 'true' &&
      needs.resolve.outputs.prerelease != 'true' &&
      needs.images.result != 'failure' &&
      needs.images.result != 'cancelled' &&
      needs.coolify.result != 'failure' &&
      needs.coolify.result != 'cancelled'
    permissions:
      contents: read
    # `./`, not GitHub's newer `$/`: moving the release pipeline to a
    # different reference syntax is a deliberate change, not a lint fix.
    uses: ./.github/workflows/deploy-cloudflare.yml # zizmor: ignore[self-repository]
    with:
      environment: production
      ref: ${{ needs.resolve.outputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-complete:
    name: Release complete
    needs: [resolve, images, coolify, cloudflare]
    # Runs even when a target failed or was skipped, so the run's conclusion is
    # the release's conclusion rather than just the last job's.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out .github/scripts/ below.
    steps:
      # The steps below run scripts from .github/scripts/, so this job needs the
      # repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IMAGES_RESULT: ${{ needs.images.result }}
          COOLIFY_RESULT: ${{ needs.coolify.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
        run: .github/scripts/release/report.sh

      - name: Fail if any target failed
        env:
          IMAGES_RESULT: ${{ needs.images.result }}
          COOLIFY_RESULT: ${{ needs.coolify.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
        run: .github/scripts/release/fail-if-any-target-failed.sh
