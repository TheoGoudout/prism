name: Deploy to Cloudflare Workers

# Builds `frontend/` and deploys it to Cloudflare Workers static assets
# (frontend/wrangler.jsonc). The backend and database go to Coolify instead, via
# `deploy-coolify.yml`; both callers below run that first so the API is upgraded
# before the frontend that calls it (see deployment.md).
#
#   called by deploy-environment.yml -> staging    (app.staging.prism.ai)
#                                    -> production (app.prism.ai)
#   called by rollback.yml           -> either, at an older tag
#   workflow_dispatch                -> either, on demand
#
# Dev (app.dev.prism.ai) is deployed by Cloudflare Workers Builds from master,
# with the `dev` environment in frontend/wrangler.jsonc.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: string
      ref:
        description: "Git ref to build from (defaults to the calling ref)"
        required: false
        type: string
    secrets:
      # Named rather than inherited.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  # Never let two deploys of the same environment race each other.
  group: deploy-cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out .github/scripts/ below.
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      # For .github/scripts/ only; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve target environment
        id: resolve
        env:
          # Set by both workflow_call and workflow_dispatch.
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: .github/scripts/deploy-cloudflare/resolve-target-environment.sh

  deploy:
    name: Deploy ${{ matrix.project }} (${{ needs.resolve-environment.outputs.environment }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-environment.outputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A production deploy builds the released tag, not whatever master has
          # drifted to since.
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # This job holds the Cloudflare token; a cache written by a less
          # privileged workflow has no business being restored into it.
          # (zizmor: cache-poisoning)
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
        run: bun run --filter "${PROJECT}" "build:${ENVIRONMENT}"

      # Refuses an empty or placeholder URL before anything is uploaded: a
      # frontend built against no API answers every call with its own
      # index.html, which no later check would notice.
      - name: Check the build targets its environment
        env:
          PROJECT: ${{ matrix.project }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
        run: .github/scripts/shared/check-the-build-targets-its-environment.sh

      - name: Deploy ${{ matrix.project }} to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.project }}
          packageManager: bun
          command: deploy --env ${{ needs.resolve-environment.outputs.environment }}

      - name: Verify the deployed site
        env:
          PROJECT: ${{ matrix.project }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: .github/scripts/deploy-cloudflare/verify-the-deployed-site.sh
