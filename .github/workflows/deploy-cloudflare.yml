name: Deploy frontend to Cloudflare

# Builds `frontend/` and deploys it to Cloudflare Workers static assets
# (frontend/wrangler.jsonc). The backend goes to Coolify instead; on a release,
# release.yml runs deploy-coolify.yml first so the API is upgraded before the
# frontend that calls it.
#
#   called by release.yml -> the published release's tag
#   workflow_dispatch     -> any ref, e.g. to roll the frontend back on its own

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, e.g. v1.2.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://app.prism.ai' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Build the released tag, not whatever master has drifted to since.
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # This job holds the Cloudflare token; a cache written by a less
          # privileged workflow has no business being restored into it.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The `production` environment's API_URL variable, when set, overrides the
      # API URL in frontend/.env.production: inline variables win over the file.
      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://api.prism.ai' }}
        run: bun run --filter frontend build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: bun
          command: deploy

      - name: Verify the deployed site
        env:
          APP_URL: ${{ vars.APP_URL || 'https://app.prism.ai' }}
        run: .github/scripts/deploy-cloudflare/verify-the-deployed-site.sh
