name: Test Frontend

# What the Cloudflare deploy does, short of uploading: type-check and build the
# production bundle, then have wrangler validate frontend/wrangler.jsonc and
# bundle the Worker. A broken deploy config fails here, on the pull request,
# instead of in the middle of a release.

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API.
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - frontend/**
              - package.json
              - bun.lock
              - .github/workflows/test-frontend.yml

  build:
    name: Build and dry-run the deploy
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci --files-ignore-unknown=true --no-errors-on-unmatched
        working-directory: frontend
      - name: Type-check and build for production
        run: bun run --filter frontend build
      - name: Check the build targets the production API
        run: grep -rqF "$(grep '^VITE_API_URL=' .env.production | cut -d= -f2)" dist/assets
        working-directory: frontend
      - name: Dry-run the Cloudflare deploy
        run: bun run deploy:dry-run
        working-directory: frontend

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-frontend: # The one check branch protection requires.
    name: All frontend checks passed
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # Reads `needs`; touches nothing.
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: build
