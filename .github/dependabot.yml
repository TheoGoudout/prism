version: 2

# Minor and patch updates are grouped into one PR per ecosystem to keep the
# noise down; major updates get their own PR since they may need code changes.
# The labels satisfy the PR label check (.github/workflows/labeler.yml).
#
# Every ecosystem waits a week before proposing a new release: most malicious
# package versions are found and yanked within days, and a week-old release
# has also had its obvious regressions reported.
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      github-actions:
        update-types: [minor, patch]

  # Python (uv workspace: backend)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python:
        update-types: [minor, patch]

  # JavaScript (bun workspace: frontend)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    ignore:
      # Pinned: newer versions change the generated client's output
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      javascript:
        update-types: [minor, patch]

  # Dockerfiles
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    ignore:
      # The Python version is upgraded deliberately, together with
      # .python-version and requires-python in backend/pyproject.toml
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        update-types: [minor, patch]

  # Images in compose*.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      docker-compose:
        update-types: [minor, patch]
