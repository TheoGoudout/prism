# The stack Coolify deploys to production: the API, its Celery worker and beat
# scheduler, Postgres and Redis. See deployment.md.
#
# The frontend is not here — it is a static site on Cloudflare Workers. It, and
# the local-only services (Adminer, MailCatcher, Playwright), live in
# compose.override.yml, which Compose merges automatically for local
# development and which Coolify never reads.
#
# No reverse proxy either: Coolify routes `api.prism.ai` to the backend's port
# 8000 and terminates TLS itself.
#
# Variables named SERVICE_* are Coolify magic variables: Coolify generates them
# on the first deploy and keeps them stable afterwards. They are referenced flat
# (an empty `:-` default only, never a chain) so Coolify's scanner reliably detects them.
# `${VAR:?}` marks a variable that must be set by hand; Coolify lists it first,
# highlighted, in the Environment Variables tab.
#
# Every service has a memory cap so that the kernel's OOM killer, if it ever
# fires, takes the container that misbehaved instead of Postgres mid-write.

services:

  db:
    image: postgres:18
    restart: always
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-}
      - POSTGRES_DB=${POSTGRES_DB:-app}

  redis:
    image: redis:7-alpine
    restart: always
    # Celery's broker and result backend; the working set is the queue.
    mem_limit: 256m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-redis-data:/data

  # Runs the migrations and creates the first superuser, then exits. The API,
  # worker and beat all wait for it to complete successfully.
  prestart:
    image: prism/backend:${TAG:-latest}
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: &backend-env
      - PROJECT_NAME=${PROJECT_NAME:-Prism}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # The frontend is on Cloudflare, not in this stack, so these are real
      # URLs rather than SERVICE_URL_* variables. FRONTEND_HOST is always an
      # allowed CORS origin; BACKEND_CORS_ORIGINS only adds extra ones.
      - FRONTEND_HOST=${FRONTEND_HOST:-https://app.prism.ai}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
      # Public URL of this API, used to build the OAuth redirect URIs:
      # {API_BASE_URL}/api/v1/oauth/callback/{platform}
      - API_BASE_URL=${API_BASE_URL:-https://api.prism.ai}
      # Signs sessions, and derives the key that encrypts the OAuth tokens
      # stored in the database (app/core/encryption.py). Coolify keeps it
      # stable across deploys. Never rotate it: every connected account would
      # have to be reconnected.
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY:-}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_FIRSTSUPERUSER:-}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-}
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_TLS=${SMTP_TLS:-}
      - SMTP_SSL=${SMTP_SSL:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID:-}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET:-}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-prism}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-}

  backend:
    image: prism/backend:${TAG:-latest}
    restart: always
    # `fastapi run --workers 4`: four copies of the app, LangChain included.
    mem_limit: 1536m
    mem_reservation: 384m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["fastapi", "run", "--workers", "4", "app/main.py"]
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    environment: *backend-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    image: prism/backend:${TAG:-latest}
    restart: always
    # Syncs and AI analyses run here; a year-in-review holds up to 300 posts.
    mem_limit: 1536m
    mem_reservation: 256m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-4}"]
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Exactly one beat may run, or every scheduled task fires twice: never scale
  # this service.
  celery-beat:
    image: prism/backend:${TAG:-latest}
    restart: always
    mem_limit: 256m
    mem_reservation: 64m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    environment: *backend-env

volumes:
  app-db-data:
  app-redis-data:
